name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pull-request runs are wasted work; superseded runs on main are
  # history, and a cancelled run there reads as a failure to anyone watching.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  server_smoke:
    name: server-smoke
    runs-on: ubuntu-24.04
    # The pinned set includes chromadb and onnxruntime, so the first install on a
    # cold cache is slow. Generous, but not the 360-minute default.
    timeout-minutes: 30
    env:
      # The smoke test sets these itself, and to the same values. Setting them
      # here too means a `python -c "import app"` typed into any other step gets
      # the same fast, offline behaviour instead of a 3-second Ollama timeout.
      PYTHONUTF8: "1"
      MYSQL_PORT: "3399"                     # nothing listens: connect is refused at once
      OLLAMA_BASE_URL: "http://127.0.0.1:1"  # port 1: probe fails at once, no 3s wait
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # The README names 3.10-3.11. 3.12 is deliberately not tested: whether
          # onnxruntime, grpcio and chroma-hnswlib publish wheels for it is
          # unverified, and a first run is a bad place to find out.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install backend dependencies
        working-directory: server
        run: python -m pip install -r requirements.txt

      # No MySQL, no Ollama, no Chroma. The application has to come up anyway and
      # say so honestly, which is what this asserts.
      - name: Smoke test
        working-directory: server
        run: python -m unittest discover -s tests -t . -v

  client_build:
    name: client-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Every `resolved` URL in the committed lockfile points at
      # registry.npmmirror.com. npm's default `replace-registry-host: npmjs` only
      # rewrites hosts that already say npmjs, so without `always` a runner
      # outside China would still be fetching from the mirror. This redirects the
      # fetches without touching the lockfile; the integrity hashes still verify.
      npm_config_registry: https://registry.npmjs.org
      npm_config_replace_registry_host: always
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      # `vite build` needs no environment variables and no running backend: the
      # API base URL falls back to a relative `/api` at runtime, and the dev
      # proxy in vite.config.js only applies to `vite dev`.
      - name: Build
        run: npm run build

  # One required status check, so branch protection does not have to be updated
  # every time the job list changes.
  ci_ok:
    name: ci-ok
    needs: [server_smoke, client_build]
    # Without `always()` a failed dependency makes this job `skipped`, and a
    # skipped required check does not report success - the pull request just
    # hangs with no red X explaining why.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify every job succeeded
        run: |
          echo "server_smoke: ${{ needs.server_smoke.result }}"
          echo "client_build: ${{ needs.client_build.result }}"
          test "${{ needs.server_smoke.result }}" = "success"
          test "${{ needs.client_build.result }}" = "success"
